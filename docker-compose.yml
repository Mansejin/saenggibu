services:
  sgb-api:
    build: .
    # NAS overrides names via .env (see docs/deploy-nas-auto.md)
    container_name: ${SGB_API_CONTAINER:-saenggibu-api}
    image: ${SGB_API_IMAGE:-saenggibu-sgb-api:latest}
    restart: unless-stopped
    expose:
      - "8787"
    env_file:
      - .env
    environment:
      # Must listen on all interfaces — gateway reaches sgb-api via docker network
      SGB_HOST: "0.0.0.0"
      SGB_PLAN: "admin"
    volumes:
      - ./data/saenggibu:/app/data/saenggibu
      - ./web/admin:/app/web/admin
    networks:
      - sgb-net

  sgb-gateway:
    image: nginx:1.27-alpine
    container_name: ${SGB_GATEWAY_CONTAINER:-saenggibu-gateway}
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - ./data/saenggibu:/var/run/sgb:ro
    depends_on:
      - sgb-api
    networks:
      - sgb-net

networks:
  sgb-net:
    driver: bridge
